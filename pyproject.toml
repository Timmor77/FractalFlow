[project]
name = "fractal-flow-tools"
version = "1.2.0"
description = "Reference rendering and benchmark tools for FractalFlow"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "mpmath>=1.4.1",
    "numpy>=2.5.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
target-version = "py312"
# Where first-party modules live (the scripts import each other by name).
src = ["scripts", "paper"]

[tool.ruff.lint]
# Errors, pyflakes, import order, modern syntax, likely bugs.
select = ["E", "F", "I", "UP", "B"]
